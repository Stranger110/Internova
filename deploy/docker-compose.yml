version: '3.8'

services:
  satellite-node-primary:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: satellite-ground-station-01
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - NODE_ID=linux-sat-node-01
      - HOST=0.0.0.0
      - PORT=8000
      - SATELLITE_DATA_DIR=/app/data
    volumes:
      - satellite_cache:/app/data
      - ../frontend:/frontend:ro
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1536M
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  satellite_cache:
    driver: local
