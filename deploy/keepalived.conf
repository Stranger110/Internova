# Keepalived High-Availability VRRP Configuration for Dual Linux Nodes
# Install: apt-get install keepalived
# Node 1: MASTER (Priority 101)
# Node 2: BACKUP (Priority 100)

vrrp_script check_sat_health {
    script "/usr/bin/curl -f http://127.0.0.1:8000/healthz"
    interval 2
    weight 2
    fall 2
    rise 2
}

vrrp_instance VI_SAT {
    state MASTER
    interface eth0             # Replace with your network interface (e.g. eth0, ens18)
    virtual_router_id 51
    priority 101
    advert_int 1

    authentication {
        auth_type PASS
        auth_pass SatGrdStnHA!
    }

    virtual_ipaddress {
        192.168.1.200/24       # Shared High-Availability Virtual IP (VIP)
    }

    track_script {
        check_sat_health
    }
}
